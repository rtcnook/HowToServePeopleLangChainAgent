[project]
name = "howtoservepeoplelangchainagent"
version = "0.2.0"
description = "Multi-agent system for Chinese civil-service job search — LangChain/LangGraph + Gemini / SiliconFlow Qwen"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.0",
    "langgraph>=1.0.1",
    "langchain-google-genai>=3.0.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.4.0",
    "tavily-python>=0.7.0",
    "langsmith>=0.3.0",
    "python-dotenv>=1.1.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
